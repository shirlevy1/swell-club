name: Push reminders

# מריץ כל 15 דקות את /api/push/send, שבודק אם יש מפגשים קרובים ושולח
# תזכורות. תדירות של רבע שעה נדרשת כדי שתזכורת "שעה לפני המפגש" תצא
# קרוב לזמן המדויק גם למפגשים בשעות לא עגולות (6:45 וכו') — ראו את
# ההערה ב-api/push/send/route.ts. הריפו ציבורי אז אין עלות על תדירות
# הרצה. ה-endpoint עצמו דואג לא לשלוח כפול (event_reminders ב-DB).
# GitHub Actions לא מבטיח דיוק של 15 דקות בדיוק, וגם מכבה workflows
# מתוזמנים אוטומטית אחרי 60 יום בלי שום commit לריפו — אם התזכורות
# מפסיקות לצאת בלי סיבה ברורה, זה המקום הראשון לבדוק.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger push reminders
        run: |
          curl -sf -X POST https://swell-club.vercel.app/api/push/send \
            -H "x-swell-cron: ${{ secrets.PUSH_CRON_SECRET }}"

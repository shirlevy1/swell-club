name: Push reminders

# מריץ כל שעתיים את /api/push/send, שבודק אם יש מפגשים קרובים ושולח
# תזכורות. היה מוגדר קודם לרבע שעה, אבל בפועל GitHub Actions הריץ את
# זה בפערים של כמה שעות בכל מקרה (נצפה בפועל, לא רק תיאורטית) — ריפו
# ציבורי לא מקבל עדיפות על תזמונים תכופים כאלה. כל התזכורות (ערב/בוקר/
# תמונות מוכנות) נבנו מראש עם חלונות רחבים בדיוק בשביל לספוג פערים
# כאלה, אז שעתיים לא פוגע בדיוק שלהן. ה-endpoint עצמו דואג לא לשלוח
# כפול (event_reminders ב-DB).
# GitHub Actions לא מבטיח דיוק של שעתיים בדיוק, וגם מכבה workflows
# מתוזמנים אוטומטית אחרי 60 יום בלי שום commit לריפו — אם התזכורות
# מפסיקות לצאת בלי סיבה ברורה, זה המקום הראשון לבדוק.
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger push reminders
        run: |
          curl -sf -X POST https://swell-club.vercel.app/api/push/send \
            -H "x-swell-cron: ${{ secrets.PUSH_CRON_SECRET }}"
